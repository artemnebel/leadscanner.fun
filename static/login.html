<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log in - Lead Scanner</title>
    <meta name="robots" content="noindex">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32.png"/>
    <link rel="icon" type="image/png" sizes="48x48" href="/static/favicon-48.png"/>
    <link rel="apple-touch-icon" sizes="180x180" href="/static/favicon-180.png"/>
    <link rel="icon" href="/favicon.ico"/>
    <link rel="shortcut icon" href="/favicon.ico"/>
    <style>
    /* Standalone auth page: no shared terminal stylesheet, no nav, nothing to
       click away to except the links this page owns. */
    * { box-sizing: border-box; }
    body {
        margin: 0; min-height: 100vh; background: #050505; color: #fff;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
    }
    body::before {
        content: ''; position: fixed; inset: 0; pointer-events: none;
        background-image:
            linear-gradient(rgba(255,255,255,0.021) 1px, transparent 1px),
            linear-gradient(90deg, rgba(255,255,255,0.021) 1px, transparent 1px);
        background-size: 46px 46px;
    }

    .au-brand {
        position: relative; z-index: 1;
        display: inline-flex; align-items: center; gap: 13px;
        padding: 26px 0 0 30px; text-decoration: none;
    }
    .au-brand svg { width: 26px; height: 26px; color: #3ee87b; flex-shrink: 0; }
    .au-brand span { color: #fff; font-size: 21px; font-weight: 700; letter-spacing: -0.02em; }

    .au-wrap {
        position: relative; z-index: 1;
        display: flex; align-items: center; justify-content: center;
        padding: clamp(24px, 5vh, 64px) 20px 64px;
        min-height: calc(100vh - 90px);
    }
    .au-card {
        width: 100%; max-width: 560px;
        background: #0b0c0e; border: 1px solid rgba(255,255,255,0.07);
        border-radius: 22px; padding: clamp(28px, 5vw, 56px);
    }
    .au-title {
        margin: 0 0 30px; text-align: center; color: #fff;
        font: 700 clamp(30px, 4vw, 42px)/1.1 'Space Grotesk', sans-serif;
        letter-spacing: -0.03em;
    }

    .au-social { display: flex; gap: 14px; }
    .au-social a {
        flex: 1; display: inline-flex; align-items: center; justify-content: center;
        min-height: 56px; border-radius: 11px;
        background: #0f1113; border: 1px solid rgba(255,255,255,0.10);
        transition: background 0.15s ease, border-color 0.15s ease;
    }
    .au-social a:hover { background: #14171a; border-color: rgba(255,255,255,0.24); }
    .au-social a:focus-visible { outline: 3px solid #bbf7d0; outline-offset: 3px; }
    .au-social svg { width: 22px; height: 22px; }

    .au-or {
        display: flex; align-items: center; gap: 16px; margin: 26px 0;
        color: #6b7280; font: 400 13px 'JetBrains Mono', monospace;
    }
    .au-or::before, .au-or::after {
        content: ''; flex: 1; height: 1px; background: rgba(255,255,255,0.10);
    }

    .au-field { margin-bottom: 20px; }
    .au-label {
        display: block; margin-bottom: 9px; color: #98a2b3;
        font-size: 14.5px; font-weight: 600;
    }
    .au-input {
        width: 100%; min-height: 58px; padding: 0 18px;
        background: #0f1113; color: #fff;
        border: 1px solid rgba(255,255,255,0.12); border-radius: 11px;
        font-family: inherit; font-size: 16px;   /* 16px stops iOS zooming on focus */
        transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }
    .au-input::placeholder { color: #5b626d; }
    .au-input:focus {
        outline: none; border-color: #3ee87b;
        box-shadow: 0 0 0 3px rgba(62,232,123,0.18);
    }
    .au-pw { position: relative; }
    .au-pw .au-input { padding-right: 52px; }
    .au-eye {
        position: absolute; top: 50%; right: 8px; transform: translateY(-50%);
        width: 40px; height: 40px; display: flex; align-items: center; justify-content: center;
        background: none; border: 0; border-radius: 8px;
        color: #8b95a5; cursor: pointer;
    }
    .au-eye:hover { color: #fff; }
    .au-eye:focus-visible { outline: 2px solid #3ee87b; outline-offset: 1px; }

    .au-forgot {
        display: inline-block; margin: 2px 0 26px;
        color: #3ee87b; font-size: 14.5px; font-weight: 600; text-decoration: none;
    }
    .au-forgot:hover { text-decoration: underline; }

    .au-submit {
        width: 100%; min-height: 60px; border: 0; border-radius: 11px;
        background: #3ee87b; color: #04150a; cursor: pointer;
        font-family: inherit; font-size: 17px; font-weight: 700;
        transition: background 0.15s ease;
    }
    .au-submit:hover:not(:disabled) { background: #5cf295; }
    .au-submit:disabled { opacity: 0.65; cursor: default; }
    .au-submit:focus-visible { outline: 3px solid #bbf7d0; outline-offset: 3px; }

    .au-help { margin: 26px 0 0; text-align: center; }
    .au-help a { color: #3ee87b; font-size: 15px; font-weight: 600; text-decoration: none; }
    .au-help a:hover { text-decoration: underline; }
    .au-signup { margin: 14px 0 0; text-align: center; color: #98a2b3; font-size: 15px; }
    .au-signup a { color: #3ee87b; font-weight: 700; text-decoration: none; }
    .au-signup a:hover { text-decoration: underline; }

    .au-error {
        display: none; margin: 0 0 22px; padding: 13px 16px;
        background: rgba(239,68,68,0.10); border: 1px solid rgba(239,68,68,0.45);
        border-radius: 11px; color: #ffb4b4; font-size: 14.5px; line-height: 1.5;
    }

    @media (max-width: 480px) {
        .au-brand { padding: 20px 0 0 20px; }
        .au-social { gap: 10px; }
    }
    </style>
</head>
<body>
    {% if maintenance %}{% include '_maintenance_banner.html' %}{% endif %}

    <!-- The wordmark is the only way off this page, and it goes home. -->
    <a class="au-brand" href="/">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="2.4"/></svg>
        <span>LeadScanner</span>
    </a>

    <div class="au-wrap">
        <main class="au-card">
            <h1 class="au-title">Log in</h1>

            <p class="au-error" id="auth-error" role="alert"></p>

            <div class="au-social">
                <a href="/api/auth/google" aria-label="Continue with Google" title="Continue with Google">
                    <svg viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                        <path d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.717v2.258h2.908c1.702-1.567 2.684-3.875 2.684-6.615z" fill="#4285F4"/>
                        <path d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.909-2.259c-.806.54-1.837.86-3.047.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 009 18z" fill="#34A853"/>
                        <path d="M3.964 10.71A5.41 5.41 0 013.682 9c0-.593.102-1.17.282-1.71V4.958H.957A8.996 8.996 0 000 9c0 1.452.348 2.827.957 4.042l3.007-2.332z" fill="#FBBC05"/>
                        <path d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 00.957 4.958L3.964 7.29C4.672 5.163 6.656 3.58 9 3.58z" fill="#EA4335"/>
                    </svg>
                </a>
                {% if facebook_enabled %}
                <a href="/api/auth/facebook" aria-label="Continue with Facebook" title="Continue with Facebook">
                    <svg viewBox="0 0 24 24" fill="#1877F2" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                        <path d="M24 12.073C24 5.405 18.627 0 12 0S0 5.405 0 12.073C0 18.1 4.388 23.094 10.125 24v-8.437H7.078v-3.49h3.047V9.41c0-3.025 1.792-4.697 4.533-4.697 1.312 0 2.686.236 2.686.236v2.97h-1.514c-1.491 0-1.956.93-1.956 1.886v2.267h3.328l-.532 3.49h-2.796V24C19.612 23.094 24 18.1 24 12.073z"/>
                    </svg>
                </a>
                {% endif %}
                {% if github_enabled %}
                <a href="/api/auth/github" aria-label="Continue with GitHub" title="Continue with GitHub">
                    <svg viewBox="0 0 24 24" fill="#fff" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                        <path d="M12 .5C5.37.5 0 5.87 0 12.5c0 5.3 3.44 9.8 8.21 11.39.6.11.82-.26.82-.58 0-.29-.01-1.05-.02-2.06-3.34.73-4.04-1.61-4.04-1.61-.55-1.39-1.34-1.76-1.34-1.76-1.09-.75.08-.73.08-.73 1.21.09 1.84 1.24 1.84 1.24 1.07 1.84 2.81 1.31 3.5 1 .11-.78.42-1.31.76-1.61-2.67-.3-5.47-1.34-5.47-5.93 0-1.31.47-2.38 1.24-3.22-.13-.3-.54-1.52.12-3.18 0 0 1.01-.32 3.3 1.23.96-.27 1.98-.4 3-.41 1.02.01 2.04.14 3 .41 2.29-1.55 3.3-1.23 3.3-1.23.66 1.66.25 2.88.12 3.18.77.84 1.24 1.91 1.24 3.22 0 4.61-2.81 5.62-5.49 5.92.43.37.81 1.1.81 2.22 0 1.61-.01 2.9-.01 3.29 0 .32.21.7.83.58C20.56 22.29 24 17.79 24 12.5 24 5.87 18.63.5 12 .5z"/>
                    </svg>
                </a>
                {% endif %}
            </div>

            <div class="au-or">or</div>

            <form id="login-form" novalidate>
                <div class="au-field">
                    <label class="au-label" for="email">Email address</label>
                    <input class="au-input" type="email" id="email" name="email"
                           placeholder="you@studio.com" required autocomplete="email" autofocus>
                </div>
                <div class="au-field">
                    <label class="au-label" for="password">Password</label>
                    <div class="au-pw">
                        <input class="au-input" type="password" id="password" name="password"
                               placeholder="••••••••" required autocomplete="current-password">
                        <button type="button" class="au-eye" id="pw-toggle" aria-label="Show password"></button>
                    </div>
                </div>
                <a class="au-forgot" href="/forgot-password">Forgot password?</a>
                <button class="au-submit" type="submit" id="submit-btn">Log in</button>
            </form>

            <p class="au-help"><a href="/contact">Can't access your account?</a></p>
            <p class="au-signup">Don't have an account? <a href="/signup">Sign up</a></p>
        </main>
    </div>

    <script>
        // Password show/hide
        (function () {
            const EYE = '<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>';
            const EYE_OFF = '<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>';
            const toggle = document.getElementById('pw-toggle');
            const input = document.getElementById('password');
            toggle.innerHTML = EYE;
            toggle.addEventListener('click', () => {
                const show = input.type === 'password';
                input.type = show ? 'text' : 'password';
                toggle.innerHTML = show ? EYE_OFF : EYE;
                toggle.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
            });
        })();

        // Already signed in: go straight through.
        const existingToken = localStorage.getItem('ls_token');
        if (existingToken) {
            fetch('/api/auth/me', { headers: { 'Authorization': 'Bearer ' + existingToken } })
                .then(r => { if (r.ok) window.location.href = '/?launched=1'; })
                .catch(() => {});
        }

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submit-btn');
            const errEl = document.getElementById('auth-error');
            errEl.style.display = 'none';
            btn.disabled = true;
            btn.textContent = 'Logging in...';

            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            const fail = (msg) => {
                errEl.textContent = msg;
                errEl.style.display = 'block';
                btn.disabled = false;
                btn.textContent = 'Log in';
            };

            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password }),
                });
                let data = {};
                try { data = await res.json(); } catch (err) {}
                if (!res.ok) {
                    fail(data.detail === 'GOOGLE_ACCOUNT'
                        ? 'This account uses Google sign-in and has no password yet. Use Continue with Google above, or set a password via Forgot password.'
                        : (typeof data.detail === 'string' ? data.detail : 'Login failed.'));
                    return;
                }
                localStorage.setItem('ls_token', data.token);
                localStorage.removeItem('ls_user');
                // Clicking a pack while logged out parks the return path here, so
                // the visitor lands back on pricing instead of losing the purchase.
                const back = sessionStorage.getItem('ls_after_login');
                sessionStorage.removeItem('ls_after_login');
                window.location.href = back || '/?launched=1';
            } catch (err) {
                console.error('[login] request failed', err);
                fail('Could not reach the server. Check your connection and try again.');
            }
        });
    </script>
</body>
</html>
