    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">

    <link rel="icon" type="image/png" sizes="48x48" href="/static/favicon-48.png"/>

    <link rel="icon" href="/favicon.ico"/>

    <style>
        body { background: #000; }

        /* ===== APP NAV (same component as admin overview) ===== */
        #app-nav {
            display: flex; align-items: center; justify-content: space-between;
            gap: 20px; height: 62px; padding: 0 22px;
            background: #000; border-bottom: 1px solid rgba(255,255,255,0.08);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }
        .an-left, .an-right { display: flex; align-items: center; gap: 8px; }
        .an-brand {
            display: inline-flex; align-items: center; gap: 10px;
            margin-right: 14px; cursor: pointer; user-select: none; text-decoration: none;
        }
        .an-brand svg { width: 21px; height: 21px; color: #3ee87b; flex-shrink: 0; }
        .an-brand span { color: #fff; font-size: 16.5px; font-weight: 700; letter-spacing: -0.02em; }
        .an-link {
            padding: 8px 13px; border-radius: 8px; text-decoration: none;
            color: #98a2b3; font-size: 14.5px; font-weight: 500; white-space: nowrap;
            transition: color 0.15s ease, background 0.15s ease;
        }
        .an-link:hover { color: #fff; background: rgba(255,255,255,0.06); }
        .an-link.is-active { color: #3ee87b; }
        .an-account {
            padding: 8px 18px; border-radius: 999px; text-decoration: none;
            border: 1px solid rgba(255,255,255,0.22); color: #fff;
            font-size: 14.5px; font-weight: 600;
            transition: background 0.15s ease, border-color 0.15s ease;
        }
        .an-account:hover { background: rgba(255,255,255,0.08); border-color: rgba(255,255,255,0.4); }
        .an-account.an-avatar {
            display: inline-flex; align-items: center; justify-content: center;
            width: 36px; height: 36px; padding: 0; border-radius: 50%;
            background: rgba(62,232,123,0.10); border: 1px solid rgba(62,232,123,0.55);
            color: #3ee87b; font-size: 15px; font-weight: 700; line-height: 1;
        }
        .an-account.an-avatar:hover { background: rgba(62,232,123,0.2); border-color: #3ee87b; }
        @media (max-width: 640px) {
            #app-nav { flex-wrap: wrap; height: auto; min-height: 62px; padding: 10px 14px; gap: 8px; }
            .an-left, .an-right { flex-wrap: wrap; row-gap: 6px; }
            .an-link-secondary { display: none; }
            .an-right .an-link { padding: 7px 10px; font-size: 13.5px; }
        }
        .an-user-wrap { position: relative; }
        .an-dropdown {
            position: absolute; top: calc(100% + 10px); right: 0; z-index: 1000;
            width: 260px; background: #101418; border: 1px solid rgba(255,255,255,0.12);
            border-radius: 14px; box-shadow: 0 16px 40px rgba(0,0,0,0.5);
            padding: 8px; font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }
        .an-dropdown.hidden { display: none; }
        .an-dd-head { display: flex; align-items: center; gap: 12px; padding: 12px 10px 14px; }
        .an-dd-avatar {
            width: 40px; height: 40px; min-width: 40px; border-radius: 50%;
            display: inline-flex; align-items: center; justify-content: center;
            background: rgba(62,232,123,0.12); border: 1px solid rgba(62,232,123,0.5);
            color: #3ee87b; font-size: 16px; font-weight: 700;
        }
        .an-dd-email { color: #fff; font-size: 14px; font-weight: 600; word-break: break-all; line-height: 1.3; }
        .an-dd-sep { height: 1px; background: rgba(255,255,255,0.08); margin: 6px 8px; }
        .an-dd-item {
            display: flex; align-items: center; gap: 12px; width: 100%;
            padding: 10px 12px; border-radius: 8px; cursor: pointer;
            background: none; border: none; color: #e7ebf0;
            font-family: inherit; font-size: 14px; text-align: left; text-decoration: none;
        }
        .an-dd-item:hover { background: rgba(255,255,255,0.07); }
        .an-dd-icon { width: 18px; height: 18px; flex-shrink: 0; color: #98a2b3; }
        .an-dd-danger { color: #ff6b6b; }
        .an-dd-danger .an-dd-icon { color: #ff6b6b; }
        .an-dd-danger:hover { background: rgba(255,107,107,0.08); }

        /* Full-width layout — overrides page.css's default 820px content cap. */
        .page-content { max-width: none; margin: 0; padding: 28px 28px 60px; }

        .back-link {
            display: inline-flex; align-items: center; gap: 6px; margin-bottom: 18px;
            color: #7c8798; text-decoration: none; font-size: 13.5px; font-weight: 600;
        }
        .back-link:hover { color: #3ee87b; }

        /* ── Toolbar ───────────────────────────────────────────────── */
        .admin-toolbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
        .admin-input {
            background: #0b0c0e; border: 1px solid rgba(255,255,255,0.12); color: #fff;
            font-family: inherit; font-size: 13.5px; padding: 9px 13px; border-radius: 9px;
            min-width: 220px; flex: 1 1 220px; max-width: 340px;
        }
        .admin-input::placeholder { color: #5b626d; }
        .admin-input:focus { outline: none; border-color: rgba(62,232,123,0.5); }
        .toolbar-count { font-size: 12.5px; color: #7c8798; letter-spacing: 0.03em; }
        .toolbar-count.sel { color: #ffb545; }
        .admin-btn {
            background: #0b0c0e; border: 1px solid rgba(255,255,255,0.14); color: #cbd2dc;
            font-family: inherit; font-size: 13.5px; font-weight: 600; border-radius: 9px;
            padding: 8px 15px; cursor: pointer; white-space: nowrap;
            transition: border-color 0.15s ease, color 0.15s ease;
        }
        .admin-btn:hover { border-color: rgba(255,255,255,0.35); color: #fff; }
        .admin-btn:disabled { opacity: 0.5; cursor: default; }
        .admin-btn.push { margin-left: auto; }
        .admin-btn.primary { border-color: rgba(255,181,69,0.5); color: #ffb545; }
        .admin-btn.primary:hover:not(:disabled) { border-color: #3ee87b; color: #3ee87b; }

        #send-promo-detail, #reconcile-promo-detail {
            margin-top: 8px; font-size: 12.5px; color: #7c8798; line-height: 1.6;
        }
        #reconcile-promo-detail .promo-fail, #reconcile-promo-detail .promo-pending { margin-right: 4px; }
        #send-promo-detail .promo-fail { margin-right: 4px; }

        /* ── Table ─────────────────────────────────────────────────── */
        .table-scroll {
            max-height: calc(100vh - 300px); min-height: 420px; overflow-y: auto; overflow-x: auto;
            border: 1px solid rgba(255,255,255,0.08); border-radius: 14px;
        }
        .admin-table { width: 100%; border-collapse: collapse; font-size: 13.5px; background: #0b0c0e; }
        .admin-table th {
            text-align: left; padding: 11px 12px; white-space: nowrap;
            color: #7c8798; font: 600 11px 'JetBrains Mono', monospace; letter-spacing: 0.06em;
            position: sticky; top: 0; background: #0b0c0e; z-index: 2;
            border-bottom: 1px solid rgba(255,255,255,0.08);
        }
        .admin-table td {
            padding: 10px 12px; border-bottom: 1px solid rgba(255,255,255,0.05);
            color: #cbd2dc; font-variant-numeric: tabular-nums; white-space: nowrap;
        }
        .admin-table tbody tr:last-child td { border-bottom: none; }
        th.sortable { cursor: pointer; user-select: none; }
        th.sortable:hover { color: #cbd2dc; }
        th.sortable .arrow { color: #3ee87b; margin-left: 3px; }
        tr.user-row { cursor: pointer; transition: background 0.15s ease; }
        tr.user-row:hover td { background: rgba(255,255,255,0.03); }
        tr.user-row.selected td { background: rgba(62,232,123,0.06); }
        tr.user-row:focus-visible { outline: 2px solid #3ee87b; outline-offset: -2px; }
        .col-num { text-align: right; }
        .col-check { width: 1%; text-align: center; }
        .col-actions { text-align: right; width: 1%; }
        td.cell-email { max-width: 260px; overflow: hidden; text-overflow: ellipsis; color: #fff; }
        .row-del {
            background: none; border: 1px solid rgba(255,255,255,0.14); color: #7c8798;
            font-family: inherit; font-size: 12px; font-weight: 600; border-radius: 7px;
            padding: 4px 10px; cursor: pointer; white-space: nowrap;
            transition: border-color 0.15s ease, color 0.15s ease;
        }
        .row-del:hover { border-color: #ff6b6b; color: #ff6b6b; }
        .row-check, .all-check { width: 15px; height: 15px; cursor: pointer; accent-color: #3ee87b; }

        .tier-free      { color: #7c8798; }
        .tier-paid      { color: #3ee87b; font-weight: 700; }
        .tier-unlimited { color: #fff; font-weight: 700; }
        .badge-g      { color: #6ea8fe; }
        .badge-pw     { color: #7c8798; }
        .badge-stripe { color: #ffb545; }
        .flag-cap     { color: #ff6b6b; font-weight: 700; }
        .muted        { color: #7c8798; }
        .promo-ok      { color: #3ee87b; }
        .promo-fail    { color: #ff6b6b; font-weight: 700; }
        .promo-pending { color: #ffb545; }
    </style>
</head>
<body>
    {% if maintenance %}{% include '_maintenance_banner.html' %}{% endif %}

    <nav id="app-nav">
        <div class="an-left">
            <a href="/" class="an-brand">
                <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                    <path d="M5.5 6.5 11 12l-5.5 5.5" stroke="currentColor" stroke-width="2.6" stroke-linecap="square"/>

    <main class="page-content">
        <a href="/admin" class="back-link">&larr; Back to admin</a>
        <h1 class="page-title" style="font-size:28px;margin-bottom:20px;">Users</h1>

        <div id="admin-loading" class="page-section">
            <p style="color:#7c8798;">Loading…</p>
        </div>

        <div id="admin-content" style="display:none">
            <div class="page-section" style="margin-top:0;">
                <div class="admin-toolbar">
                    <input id="user-filter" class="admin-input" type="text" placeholder="Filter by email…" autocomplete="off" />
                    <span class="toolbar-count" id="user-count"></span>
                    <span class="toolbar-count sel" id="sel-count"></span>
                    <button id="send-promo-btn" class="admin-btn primary push" type="button" title="Send the founding-user promo email to the checked users" disabled>Send promo</button>
                    <button id="export-users-btn" class="admin-btn" type="button" title="Download the users currently shown (respects the email filter) as a CSV file">Export CSV</button>
                    <button id="reconcile-promo-btn" class="admin-btn" type="button" title="Check Resend for who actually received the founding-user promo and stamp the PROMO column">Sync promo sends</button>
                    <span id="reconcile-promo-status" class="toolbar-count"></span>
                </div>
                <div id="send-promo-detail"></div>
                <div id="reconcile-promo-detail"></div>
                <div class="table-scroll">
                    <table class="admin-table">
                        <thead>
                            <tr>
                                <th class="col-check"><input type="checkbox" class="all-check" id="all-check" title="Select all shown" /></th>
                                <th>#</th>
                                <th>EMAIL</th>
                                <th>TIER</th>
                                <th class="sortable col-num" data-sort="total_scans">SCANS</th>
                                <th class="sortable col-num" data-sort="leads_found">LEADS</th>
                                <th class="sortable col-num" data-sort="search_count">SEARCHES</th>
                                <th class="sortable" data-sort="last_active">LAST ACTIVE</th>
                                <th class="sortable" data-sort="created_at">JOINED</th>
                                <th class="sortable" data-sort="promo_sent_at" title="When the founding-user promo email was sent to this user">PROMO</th>
                                <th>FLAGS</th>
                                <th class="col-actions">ACTIONS</th>
                            </tr>
                        </thead>
                        <tbody id="user-table-body"></tbody>
                    </table>
                </div>
            </div>
        </div>

    <script src="/static/auth.js?v={{ version }}"></script>
    <script>
    (async function() {
        const token = getToken();
        if (!token) { window.location.href = '/login'; return; }

        // ── Fetch users ────────────────────────────────────────────
        let users;
        try {
            const res = await fetch('/api/admin/users', { headers: { 'Authorization': 'Bearer ' + token } });
            if (res.status === 401 || res.status === 403) { window.location.href = '/login'; return; }
            users = await res.json();
        } catch (e) {
            document.getElementById('admin-loading').textContent = 'ERROR: Could not load users.';
            return;
        }

        document.getElementById('admin-loading').style.display = 'none';
        document.getElementById('admin-content').style.display = 'block';

        // ── Helpers ────────────────────────────────────────────────
        const parseDate = (s) => s ? new Date(s.replace(' ', 'T')) : null;
        const DAY = 86400000;
        const now = Date.now();
        const fmtDate = (s) => s ? s.slice(0, 10) : '-';
        const relDays = (s) => {
            const d = parseDate(s); if (!d) return '-';
            const days = Math.floor((now - d.getTime()) / DAY);
            return days <= 0 ? 'today' : days === 1 ? '1d ago' : days + 'd ago';
        };

        // ── Users table (filter + sort + selection + render) ───────
        const tbody = document.getElementById('user-table-body');
        const countEl = document.getElementById('user-count');
        const selCountEl = document.getElementById('sel-count');
        const allCheck = document.getElementById('all-check');
        const sendBtn = document.getElementById('send-promo-btn');
        let filterText = '';
        let sortKey = 'created_at';
        let sortDir = 'desc';
        const selected = new Set();  // selected emails (survives filter/sort)

        function sortVal(u, key) {
            if (key === 'last_active' || key === 'created_at' || key === 'promo_sent_at') {
                const d = parseDate(u[key]); return d ? d.getTime() : 0;
            }
            return u[key] || 0;
        }

        function computeRows() {
            return users
                .filter(u => u.email.toLowerCase().includes(filterText))
                .sort((a, b) => {
                    const av = sortVal(a, sortKey), bv = sortVal(b, sortKey);
                    const cmp = av < bv ? -1 : av > bv ? 1 : 0;
                    return sortDir === 'asc' ? cmp : -cmp;
                });
        }

        function updateSelectionUI() {
            const rows = computeRows();
            const shownSelected = rows.filter(u => selected.has(u.email)).length;
            selCountEl.textContent = selected.size ? `[ ${selected.size} selected ]` : '';
            sendBtn.disabled = selected.size === 0;
            sendBtn.textContent = selected.size ? `[ SEND PROMO → ${selected.size} ]` : '[ SEND PROMO ]';
            allCheck.checked = rows.length > 0 && shownSelected === rows.length;
            allCheck.indeterminate = shownSelected > 0 && shownSelected < rows.length;
        }

        function render() {
            const rows = computeRows();

            countEl.textContent = `[ ${rows.length} / ${users.length} ]`;
            tbody.innerHTML = '';

            rows.forEach((u, i) => {
                const tierClass = u.tier === 'free' ? 'tier-free'
                    : u.tier === 'unlimited' ? 'tier-unlimited' : 'tier-paid';
                const capped = (u.total_scans || 0) >= (u.scan_limit ?? 50);

                const tr = document.createElement('tr');
                tr.className = 'user-row' + (selected.has(u.email) ? ' selected' : '');
                tr.tabIndex = 0;
                tr.dataset.email = u.email;

                const checkTd = document.createElement('td'); checkTd.className = 'col-check';
                const cb = document.createElement('input');
                cb.type = 'checkbox'; cb.className = 'row-check'; cb.checked = selected.has(u.email);
                cb.addEventListener('click', (e) => e.stopPropagation());
                cb.addEventListener('change', () => {
                    if (cb.checked) selected.add(u.email); else selected.delete(u.email);
                    tr.classList.toggle('selected', cb.checked);
                    updateSelectionUI();
                });
                checkTd.appendChild(cb);

                const num = document.createElement('td'); num.className = 'muted'; num.textContent = i + 1;
                const email = document.createElement('td'); email.className = 'cell-email'; email.textContent = u.email; email.title = u.email;
                const tier = document.createElement('td'); tier.className = tierClass; tier.textContent = u.tier.toUpperCase();
                const scans = document.createElement('td'); scans.className = 'col-num' + (capped ? ' flag-cap' : '');
                scans.textContent = (u.total_scans || 0) + ' / ' + (u.scan_limit ?? 50);
                const leads = document.createElement('td'); leads.className = 'col-num'; leads.textContent = (u.leads_found || 0).toLocaleString();
                const searches = document.createElement('td'); searches.className = 'col-num'; searches.textContent = u.search_count || 0;
                const active = document.createElement('td'); active.className = 'muted'; active.textContent = relDays(u.last_active);
                const joined = document.createElement('td'); joined.className = 'muted'; joined.textContent = fmtDate(u.created_at);
                const promo = document.createElement('td');
                if (u.promo_sent_at) {
                    promo.className = 'promo-ok'; promo.textContent = fmtDate(u.promo_sent_at);
                    promo.title = 'delivered ' + u.promo_sent_at;
                } else if (u.promo_status) {
                    const s = u.promo_status.toLowerCase();
                    const failed = ['bounced', 'complained', 'canceled', 'failed', 'suppressed'].includes(s);
                    promo.className = failed ? 'promo-fail' : 'promo-pending';
                    promo.textContent = s; promo.title = 'not delivered: ' + s;
                } else { promo.className = 'muted'; promo.textContent = '—'; }

                const flags = document.createElement('td');
                const parts = [];
                parts.push(u.google ? '<span class="badge-g">[G]</span>' : '<span class="badge-pw">[PW]</span>');
                if (u.has_stripe) parts.push('<span class="badge-stripe">[$]</span>');
                if (capped) parts.push('<span class="flag-cap">[CAP]</span>');
                flags.innerHTML = parts.join(' ');  // trusted static strings

                const actions = document.createElement('td'); actions.className = 'col-actions';
                const delBtn = document.createElement('button');
                delBtn.type = 'button'; delBtn.className = 'row-del'; delBtn.textContent = '[ DEL ]';
                delBtn.title = 'Delete this user';
                delBtn.addEventListener('click', (e) => { e.stopPropagation(); deleteUser(u); });
                actions.appendChild(delBtn);

                // Clicking a row (anywhere but the checkbox/delete) opens the full-page detail.
                const goDetail = () => { window.location.href = '/admin/user?email=' + encodeURIComponent(u.email); };
                tr.append(checkTd, num, email, tier, scans, leads, searches, active, joined, promo, flags, actions);
                tr.addEventListener('click', goDetail);
                tr.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); goDetail(); }
                });
                tbody.appendChild(tr);
            });

            document.querySelectorAll('th.sortable').forEach(th => {
                const arrow = th.dataset.sort === sortKey ? (sortDir === 'asc' ? ' ▲' : ' ▼') : '';
                th.setAttribute('aria-sort', th.dataset.sort === sortKey ? (sortDir === 'asc' ? 'ascending' : 'descending') : 'none');
                th.querySelector('.arrow')?.remove();
                if (arrow) { const s = document.createElement('span'); s.className = 'arrow'; s.textContent = arrow; th.appendChild(s); }
            });

            updateSelectionUI();
        }

        document.querySelectorAll('th.sortable').forEach(th => {
            th.addEventListener('click', () => {
                const key = th.dataset.sort;
                if (sortKey === key) { sortDir = sortDir === 'asc' ? 'desc' : 'asc'; }
                else { sortKey = key; sortDir = 'desc'; }
                render();
            });
        });

        // Select-all toggles every currently-filtered row.
        allCheck.addEventListener('change', () => {
            const rows = computeRows();
            if (allCheck.checked) rows.forEach(u => selected.add(u.email));
            else rows.forEach(u => selected.delete(u.email));
            render();
        });

        let filterTimer;
        document.getElementById('user-filter').addEventListener('input', (e) => {
            clearTimeout(filterTimer);
            filterTimer = setTimeout(() => { filterText = e.target.value.trim().toLowerCase(); render(); }, 150);
        });

        // ── Delete a user ──────────────────────────────────────────
        async function deleteUser(u) {
            let msg = `Delete ${u.email}?\n\nThis permanently removes their account, saved clients, and search history. This cannot be undone.`;
            if (u.has_stripe) msg += `\n\nNOTE: this user has a Stripe billing record — deleting here does NOT cancel any active subscription in Stripe.`;
            if (!confirm(msg)) return;
            try {
                const r = await fetch('/api/admin/delete-user', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
                    body: JSON.stringify({ email: u.email }),
                });
                const data = await r.json();
                if (!r.ok) throw new Error(data.detail || ('HTTP ' + r.status));
                users = users.filter(x => x.email !== u.email);
                selected.delete(u.email);
                render();
            } catch (e) {
                alert('Delete failed: ' + e.message);
            }
        }

        // ── Send promo to selected users ───────────────────────────
        const sendDetail = document.getElementById('send-promo-detail');
        sendBtn.addEventListener('click', async () => {
            const emails = [...selected];
            if (!emails.length) return;
            const already = emails.filter(e => {
                const u = users.find(x => x.email === e);
                return u && u.promo_sent_at;
            }).length;
            let msg = `Send the founding-user promo email to ${emails.length} selected user${emails.length === 1 ? '' : 's'}?`;
            if (already) msg += `\n\n${already} of them were already marked as sent — they will be emailed again.`;
            if (!confirm(msg)) return;

            const prev = sendBtn.textContent;
            sendBtn.disabled = true;
            sendBtn.textContent = '[ SENDING... ]';
            sendDetail.innerHTML = '';
            try {
                const r = await fetch('/api/admin/send-promo', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
                    body: JSON.stringify({ emails }),
                });
                const data = await r.json();
                if (!r.ok) throw new Error(data.detail || ('HTTP ' + r.status));

                sendDetail.innerHTML = '';
                const summary = document.createElement('div');
                summary.textContent = `Sent ${data.sent}, failed ${data.failed}.`;
                sendDetail.appendChild(summary);
                (data.results || []).filter(x => !x.ok).forEach(x => {
                    const row = document.createElement('div');
                    const tag = document.createElement('span');
                    tag.className = 'promo-fail';
                    tag.textContent = '[failed]';
                    row.appendChild(tag);
                    row.appendChild(document.createTextNode(' ' + x.email + (x.error ? ' — ' + x.error : '')));
                    sendDetail.appendChild(row);
                });

                // Clear selection for successfully-sent users, refresh table.
                (data.results || []).forEach(x => { if (x.ok) selected.delete(x.email); });
                const res = await fetch('/api/admin/users', { headers: { 'Authorization': 'Bearer ' + token } });
                users = await res.json();
                render();
            } catch (e) {
                sendDetail.innerHTML = '';
                const err = document.createElement('div');
                err.className = 'promo-fail';
                err.textContent = 'ERROR: ' + e.message;
                sendDetail.appendChild(err);
            } finally {
                sendBtn.disabled = selected.size === 0;
                sendBtn.textContent = prev;
                updateSelectionUI();
            }
        });

        // ── CSV export (users currently shown) ─────────────────────
        function csvEscape(v) {
            const s = v == null ? '' : String(v);
            return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
        }

        function exportUsersCsv() {
            const cols = [
                ['email',        u => u.email],
                ['tier',         u => u.tier],
                ['total_scans',  u => u.total_scans || 0],
                ['scan_limit',   u => u.scan_limit],
                ['leads_found',  u => u.leads_found || 0],
                ['searches',     u => u.search_count || 0],
                ['lead_credits', u => u.lead_credits || 0],
                ['paid_stripe',  u => u.has_stripe ? 'yes' : 'no'],
                ['auth',         u => u.google ? 'google' : 'password'],
                ['joined',       u => u.created_at || ''],
                ['last_active',  u => u.last_active || ''],
                ['usage_reset',  u => u.usage_reset || ''],
                ['promo_sent_at',u => u.promo_sent_at || ''],
                ['promo_status', u => u.promo_status || ''],
            ];
            const rows = computeRows();
            const lines = [cols.map(c => c[0]).join(',')];
            rows.forEach(u => lines.push(cols.map(c => csvEscape(c[1](u))).join(',')));
            const csv = '﻿' + lines.join('\r\n') + '\r\n';  // BOM → Excel reads UTF-8

            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'leadscanner-users-' + new Date().toISOString().slice(0, 10) + '.csv';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            setTimeout(() => URL.revokeObjectURL(url), 1000);
        }

        document.getElementById('export-users-btn').addEventListener('click', exportUsersCsv);

        // ── Sync promo sends (pull Resend delivery logs, stamp PROMO) ──
        const reconcileBtn = document.getElementById('reconcile-promo-btn');
        const reconcileStatus = document.getElementById('reconcile-promo-status');
        reconcileBtn.addEventListener('click', async () => {
            if (!confirm('Check Resend and stamp everyone who actually received the promo email?')) return;
            const prev = reconcileBtn.textContent;
            reconcileBtn.disabled = true;
            reconcileBtn.textContent = '[ SYNCING... ]';
            reconcileStatus.textContent = '';
            try {
                const r = await fetch('/api/admin/reconcile-promo', {
                    method: 'POST',
                    headers: { 'Authorization': 'Bearer ' + token },
                });
                const data = await r.json();
                if (!r.ok) throw new Error(data.detail || ('HTTP ' + r.status));
                reconcileStatus.textContent =
                    `[ ${data.users_updated} stamped, ${data.already_marked} already, ` +
                    `${data.received} received, ${data.not_received.length} not ]`;

                // list exactly who did NOT receive it (built via DOM — no injection)
                const detail = document.getElementById('reconcile-promo-detail');
                detail.innerHTML = '';
                if (data.not_received.length) {
                    const title = document.createElement('div');
                    title.textContent = 'Did NOT receive (' + data.not_received.length + '):';
                    detail.appendChild(title);
                    data.not_received.forEach(x => {
                        const s = (x.status || '').toLowerCase();
                        const failed = ['bounced', 'complained', 'canceled', 'failed', 'suppressed'].includes(s);
                        const row = document.createElement('div');
                        const tag = document.createElement('span');
                        tag.className = failed ? 'promo-fail' : 'promo-pending';
                        tag.textContent = '[' + s + ']';
                        row.appendChild(tag);
                        row.appendChild(document.createTextNode(' ' + x.email));
                        detail.appendChild(row);
                    });
                } else {
                    detail.textContent = 'Everyone targeted received it.';
                }

                // refresh the table so the PROMO column reflects the new stamps
                const res = await fetch('/api/admin/users', { headers: { 'Authorization': 'Bearer ' + token } });
                users = await res.json();
                render();
            } catch (e) {
                reconcileStatus.textContent = 'ERROR: ' + e.message;
            } finally {
                reconcileBtn.disabled = false;
                reconcileBtn.textContent = prev;
            }
        });

        render();
    })();
    </script>
</body>
</html>
