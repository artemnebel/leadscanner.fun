<!-- Full-screen "app is offline" screen. Included on the pages that ARE the app
     (the scanner and the client portal), so they are unusable rather than
     half-working. Marketing pages get the banner only. -->
<div id="maintenance-notice" role="status" aria-live="polite">
    <div class="mt-card">
        <span class="mt-mark">&gt;_</span>
        <h1 class="mt-title">Lead Scanner is under development</h1>
        <p class="mt-text">The scanner is offline while we finish the new pricing. It will be back within 48 hours.</p>
        <div class="mt-actions">
            <a class="mt-btn" href="/pricing">See pricing</a>
            <a class="mt-link" href="/contact">Contact</a>
        </div>
    </div>
</div>
<style>
    /* z-index sits one below #landing-overlay (100000) so logged-out visitors
       still get the marketing page; the banner above it is higher again. */
    #maintenance-notice {
        position: fixed; inset: 0;
        top: var(--maint-h, 0px);   /* after inset, so it clears the banner */
        z-index: 99999;
        display: flex; align-items: center; justify-content: center;
        padding: 24px; background: #050505;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }
    #maintenance-notice::before {
        content: ''; position: absolute; inset: 0; pointer-events: none;
        background-image:
            linear-gradient(rgba(255,255,255,0.021) 1px, transparent 1px),
            linear-gradient(90deg, rgba(255,255,255,0.021) 1px, transparent 1px);
        background-size: 46px 46px;
    }
    .mt-card { position: relative; max-width: 540px; text-align: center; }
    .mt-mark {
        display: inline-flex; align-items: center; justify-content: center;
        width: 46px; height: 46px; border-radius: 11px; margin-bottom: 22px;
        background: #111418; border: 1px solid rgba(255,255,255,0.10); color: #4ade80;
        font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 19px; letter-spacing: -1px;
    }
    .mt-title {
        margin: 0; color: #fff; letter-spacing: -0.03em; text-wrap: balance;
        font: 800 clamp(26px, 3.4vw, 40px)/1.12 'Inter', sans-serif;
    }
    .mt-text {
        margin: 16px auto 0; max-width: 420px; color: #98a2b3;
        font: 400 clamp(15px, 1.3vw, 17px)/1.6 'Inter', sans-serif;
    }
    .mt-actions { display: flex; align-items: center; justify-content: center; gap: 20px; margin-top: 30px; flex-wrap: wrap; }
    .mt-btn {
        display: inline-flex; align-items: center; justify-content: center;
        min-height: 48px; padding: 0 28px; border-radius: 10px;
        background: #3ee87b; color: #04150a; text-decoration: none;
        font: 700 15px 'Inter', sans-serif; transition: background 0.16s ease;
    }
    .mt-btn:hover { background: #5cf295; }
    .mt-btn:focus-visible, .mt-link:focus-visible { outline: 3px solid #bbf7d0; outline-offset: 3px; }
    .mt-link { color: #98a2b3; text-decoration: none; font: 500 15px 'Inter', sans-serif; }
    .mt-link:hover { color: #fff; }
</style>
